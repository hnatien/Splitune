# Local development services. Credentials here are fake, local-only values that match .env.example.
# Ports bind to 127.0.0.1 so nothing is exposed on the LAN.
name: splitune

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: splitune
      POSTGRES_PASSWORD: splitune-dev-password
      POSTGRES_DB: splitune
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep PGDATA in a versioned subdirectory of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitune -d splitune"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # SeaweedFS stands in for Cloudflare R2 (MinIO Community images were withdrawn in 2026).
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command:
      - server
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # One-shot job: creates the media bucket if it does not exist yet, applies the browser CORS rules
  # (local copy of infra/r2/cors.json for the local app origin; put-bucket-cors replaces them, so
  # reruns are idempotent), then exits.
  seaweedfs-init:
    image: amazon/aws-cli:2.38.2
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: splitune-dev-access-key
      AWS_SECRET_ACCESS_KEY: splitune-dev-secret-key-not-a-real-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://seaweedfs:8333
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    volumes:
      - ./seaweedfs/cors.json:/etc/seaweedfs/cors.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        (aws s3api head-bucket --bucket splitune-media 2>/dev/null
        || aws s3api create-bucket --bucket splitune-media)
        && aws s3api put-bucket-cors --bucket splitune-media
        --cors-configuration file:///etc/seaweedfs/cors.json
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Optional observability (16 §1, 25 §1): Grafana with Tempo/Loki/Prometheus and an OTLP collector
  # in one container, plus the product dashboards over the `dashboards` views. Start with
  # `docker compose -f infra/docker-compose.yml --profile observability up -d`, run `pnpm db:roles`
  # once (DB_DASHBOARD_PASSWORD), then open http://localhost:3001 (folder "Splitune"). Point the
  # app and workers at it with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318.
  otel-lgtm:
    image: grafana/otel-lgtm:0.35.0
    profiles: ["observability"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_DASHBOARD_PASSWORD: ${DB_DASHBOARD_PASSWORD:-dev-only-dashboard-password}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "127.0.0.1:3001:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./grafana/provisioning/datasources/splitune.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/splitune.yaml:ro
      - ./grafana/provisioning/dashboards/splitune.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/splitune.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/splitune-dashboards:ro
    restart: unless-stopped

volumes:
  postgres-data:
  seaweedfs-data:
