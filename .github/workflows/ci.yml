name: CI

on:
  pull_request:
  push:
    branches: [dev]
  # Nightly: the full E2E matrix (every spec × desktop, phone and tablet projects, 18 §1).
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-24.04
    # The nightly full matrix runs about twice as long as a pull request.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.3"
          enable-cache: true
          cache-dependency-glob: services/ml/uv.lock

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Storybook story tests run in Chromium and WebKit (docs/specs/28-ui-quality-and-design-review.md §2);
      # the web E2E journeys add Firefox (24-browser-compatibility.md §6).
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @splitune/web exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium, Firefox and WebKit
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @splitune/web exec playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @splitune/web exec playwright install-deps chromium firefox webkit

      - name: Install Python dependencies
        working-directory: services/ml
        run: |
          uv sync --locked --extra cpu
          uv sync --locked --project islands/torch --extra cpu
          uv lock --check --project islands/torch
          uv lock --check --project islands/onnx-cpu

      # The decode stage, codec simulator and their tests shell out to ffmpeg/ffprobe. The Mac
      # pins FFmpeg 8.1 (Homebrew ffmpeg@8); Ubuntu's build is older, which only changes
      # audio_hash values, and no test pins those.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # pnpm audit (fails on critical) and pip-audit over the ML workspace and islands (fails on
      # anything not accepted in scripts/audit/findings.mjs), 17 §7.
      - name: Dependency audit
        run: pnpm audit:deps

      # Regenerates JSON Schema and Pydantic models into a temp dir; fails if the committed ones differ.
      - name: Contracts drift
        run: pnpm contracts:check

      # Fails if the Drizzle schema changed without a committed migration.
      - name: Migrations drift
        run: pnpm db:check

      # packages/db, packages/storage and apps/api integration tests use the compose Postgres,
      # SeaweedFS and Mailpit (magic-link emails) with the .env.example values.
      - name: Start Postgres, SeaweedFS and Mailpit
        run: |
          docker compose -f infra/docker-compose.yml up -d --wait postgres seaweedfs mailpit
          docker compose -f infra/docker-compose.yml run --rm seaweedfs-init

      # The root scripts fan out through Turborepo; for services/ml they run
      # `uv run ruff check`, `uv run pyright` and `uv run pytest`.
      - name: Lint (Biome, ruff)
        run: pnpm lint

      - name: Typecheck (tsc, pyright)
        run: pnpm typecheck

      # Includes the @splitune/ui-tokens contrast, gamut, CVD and naming tests (28 §3).
      - name: Test (Vitest, pytest)
        run: pnpm test

      # `pnpm test` builds dsp.wasm first (turbo ^build): the pinned Emscripten image, failing if
      # its sha256 differs from packages/audio-dsp/dsp.wasm.sha256. This suite renders the engine
      # through the real AudioWorklet offline and checks stem decode alignment (11 §8, 18 §2).
      - name: Audio engine offline render (Chromium, Firefox, WebKit)
        run: pnpm --filter @splitune/audio-engine test:browser

      # Every story rendered in Chromium and WebKit with axe (a11y test 'error').
      - name: Story tests (Storybook, Chromium + WebKit)
        run: pnpm --filter @splitune/web test:stories

      # The visual matrix (28 §4) against the committed baselines, Chromium + WebKit inside the
      # pinned Playwright image (linux/amd64, like the baselines); diffs are kept on failure.
      - name: Visual regression (Storybook screens, Docker)
        run: pnpm --filter @splitune/web e2e:visual

      # The combined server (web + API under /v1) Railway starts with `pnpm --filter @splitune/web start`.
      - name: Build the app server
        run: pnpm --filter @splitune/web build

      # Practice route JS (10 §9, 12 §10): ≤ 302 KB gzip, alphaTab and WASM excluded.
      - name: Practice route JS budget
        run: pnpm --filter @splitune/web budget --enforce

      # Nothing in the built CSS above the Safari 16.4 / Chrome 111 / Firefox 128 floor (24 §2).
      - name: CSS floor
        run: pnpm --filter @splitune/web css-floor

      # The practice suite plays audio in a real AudioContext: Firefox needs an output device,
      # which the runner hasn't (Chromium and WebKit fall back to a fake one themselves).
      - name: Audio output for Firefox (PulseAudio null sink)
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=null
          pactl set-default-sink null

      # Pull requests and pushes: the smoke subset (import → analysis → practice at 70 % with
      # count-in, edits, onboarding, delete song and account) on Chromium, Firefox and WebKit.
      - name: E2E smoke (Playwright)
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: pnpm --filter @splitune/web e2e:smoke

      # Nightly: every spec (adds billing, PWA, forced browser fallbacks, accessibility across
      # appearances) on Chromium, Firefox, WebKit, Pixel 7, iPhone 15, iPad Pro 11 and Galaxy Tab.
      - name: E2E full matrix (Playwright)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pnpm --filter @splitune/web e2e

      - name: Lighthouse CI (Home, mobile)
        run: pnpm --filter @splitune/web lighthouse

      # Visual diffs and E2E traces, whichever step failed.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: apps/web/test-results/
          retention-days: 7
