[project]
name = "splitune-ml-core"
version = "0.0.0"
description = "Shared contracts, settings, job consumer, storage, artefacts, islands and logging"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3==1.43.115",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
]

[project.scripts]
splitune-ml-worker = "splitune_ml_core.worker:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14"]
build-backend = "uv_build"
