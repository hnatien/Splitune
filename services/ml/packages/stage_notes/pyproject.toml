[project]
name = "stage-notes"
version = "0.0.0"
description = "Note transcription (Basic Pitch ONNX; YourMT3+ candidate; Transkun V2 piano)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "librosa==0.11.0",  # Guitab features (guitab.py) in the onnx-cpu island
    "numpy==2.5.4",
    "onnxruntime==1.31.0",
    "pyyaml==6.0.3",
    "scipy==1.18.1",
    "soundfile==0.14.0",
    "splitune-ml-core",
    "stage-separation",
]

[project.optional-dependencies]
# YourMT3+ (P2 candidate, torch island). Its inference code comes from the HF space and lives under
# ML_MODELS_DIR/yourmt3/src (scripts/fetch_models.py); these are the packages that code imports.
yourmt3 = [
    "deprecated==3.0.0",
    "einops==0.8.2",
    "lightning==2.6.6",
    "mido==1.3.3",
    "torch==2.14.1",
    "torchaudio==2.11.0",
    "transformers==4.45.1",  # the space's pin: its T5 subclasses track 4.45 internals
]
# Transkun V2 (piano, torch island). The weights come from the same wheel through
# scripts/fetch_models.py; the package's training-only requirements are trimmed by the
# `[[tool.uv.dependency-metadata]]` entry of each project that installs this extra.
transkun = [
    "mir-eval==0.8.2",
    "pretty-midi==0.2.11.post0",
    "torch==2.14.1",
    "torchaudio==2.11.0",
    "transkun==2.0.1",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14"]
build-backend = "uv_build"
