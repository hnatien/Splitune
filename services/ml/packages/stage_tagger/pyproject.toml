[project]
name = "stage-tagger"
version = "0.0.0"
description = "Instrument presence tagging (PANNs Cnn14 via ONNX Runtime)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "onnxruntime==1.31.0",
    "scipy==1.18.1",
    "soundfile==0.14.0",
    "splitune-ml-core",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14"]
build-backend = "uv_build"
