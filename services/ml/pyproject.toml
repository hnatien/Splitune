[project]
name = "splitune-ml"
version = "0.0.0"
description = "Splitune ML pipeline workspace (docs/implementation/06-ml-pipeline-service.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "splitune-ml-core",
    "stage-decode",
    "stage-beats",
    "stage-tagger",
    "stage-separation[models]",
    "stage-chords[models]",
    "stage-notes[yourmt3,transkun]",
    "stage-sections",
    "stage-lyrics",
    "stage-url-import",
    "splitune-eval",
]

[project.optional-dependencies]
cpu = [
    "torch",
    "torchaudio",
]
cuda = [
    "torch",
    "torchaudio",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]==1.43.115",
    "datamodel-code-generator==0.86.0",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.17.1",
    "types-pyyaml==6.0.12.20260906",
]

[tool.uv]
package = false
required-version = ">=0.13,<0.14"
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

[tool.uv.workspace]
members = ["packages/*", "eval"]
# Each island is its own uv project and venv (06-ml-pipeline-service.md §0).
exclude = ["islands/*"]

[tool.uv.sources]
splitune-ml-core = { workspace = true }
stage-decode = { workspace = true }
stage-beats = { workspace = true }
stage-tagger = { workspace = true }
stage-separation = { workspace = true }
stage-chords = { workspace = true }
stage-notes = { workspace = true }
stage-sections = { workspace = true }
stage-lyrics = { workspace = true }
stage-url-import = { workspace = true }
splitune-eval = { workspace = true }
# Linux (CI) and CPU dev get pytorch-cpu; CUDA builds get pytorch-cu126; macOS wheels come from PyPI.
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu126", extra = "cuda", marker = "sys_platform != 'darwin'" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu126", extra = "cuda", marker = "sys_platform != 'darwin'" },
]

# transkun 2.0.1 declares its training and plotting tools (tensorboard, seaborn, sox, ncls, ...) as
# requirements; inference (stage_notes.transkun) imports only these.
[[tool.uv.dependency-metadata]]
name = "transkun"
version = "2.0.1"
requires-dist = ["mir-eval", "numpy", "pretty-midi", "scipy", "torch", "torchaudio"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
# Generated: long Literal unions and regex patterns can't be wrapped.
"packages/splitune_ml_core/src/splitune_ml_core/contracts/_generated.py" = ["E501"]

[tool.pyright]
include = ["packages", "scripts", "eval", "conftest.py"]
extraPaths = ["eval"]
pythonVersion = "3.12"
pythonPlatform = "Darwin"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["packages", "eval/tests"]
pythonpath = ["eval"]
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = [
    "models: runs real model weights (beat_this checkpoints are downloaded on first use)",
]
