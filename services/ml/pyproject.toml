[project]
name = "splitune-ml"
version = "0.0.0"
description = "Splitune ML pipeline workspace (docs/implementation/06-ml-pipeline-service.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "splitune-ml-core",
    "stage-decode",
    "stage-beats",
    "stage-tagger",
    "stage-separation",
    "stage-chords",
    "stage-notes",
    "stage-sections",
    "stage-lyrics",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.uv]
package = false
required-version = ">=0.13,<0.14"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
splitune-ml-core = { workspace = true }
stage-decode = { workspace = true }
stage-beats = { workspace = true }
stage-tagger = { workspace = true }
stage-separation = { workspace = true }
stage-chords = { workspace = true }
stage-notes = { workspace = true }
stage-sections = { workspace = true }
stage-lyrics = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PT"]

[tool.pyright]
include = ["packages"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib"]
