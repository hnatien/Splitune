# Note transcription per instrument (06 §0 notes.*; P2 chooses the transcriber, 08).
# `transcriber` selects the NoteTranscriber; `params` override that transcriber's defaults.
# The transcriber also decides the island: basic_pitch and guitab → onnx-cpu (CPU slot), yourmt3
# and transkun → torch (MPS).
version: 1

instruments:
  guitar:
    # Step 22, P2g (eval/results/p2g/2026-10-28-finetune.md): Guitab E25 beats Basic Pitch on the
    # held-out sources (GuitarSet player 05, Guitar-TECHS, IDMT-SMT-Guitar) and, with its own
    # per-string probabilities as the fret DP's string cue, roughly doubles Tab F1. Bends come
    # from Basic Pitch's contour on the same stem (guitab.with_bends).
    transcriber: guitab
    params:
      a4_compensation: true
      tuning_suggestion: true
      bends: true
  bass:
    # ≈30 Hz floor (06 §4) and a ceiling well above a 4-string's 24th fret (G5 ≈ 784 Hz is rare).
    # Thresholds from the P2 sweep on separated stems (eval/results/p2).
    transcriber: basic_pitch
    params: {min_freq_hz: 30, max_freq_hz: 600, onset_threshold: 0.7, frame_threshold: 0.5}
  piano:
    # P2 (eval/results/p2/2026-10-23.md): Transkun V2 on separated stems 0.946 onset F1 (MAESTRO
    # test excerpts + band) vs YourMT3+ 0.900 and Basic Pitch 0.645.
    transcriber: transkun
  vocals:
    transcriber: basic_pitch
    params: {min_freq_hz: 65, max_freq_hz: 1400}
