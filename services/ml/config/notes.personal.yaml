# Note transcription per instrument (06 §0 notes.*; P2 chooses the transcriber, 08).
# `transcriber` selects the NoteTranscriber; `params` override that transcriber's defaults.
# The transcriber also decides the island: basic_pitch → onnx-cpu (CPU slot), yourmt3 and
# transkun, adtof → torch (MPS).
version: 1

instruments:
  guitar:
    # Thresholds from the P2 sweep on separated stems (eval/results/p2).
    transcriber: basic_pitch
    params: {min_freq_hz: 70, onset_threshold: 0.6, frame_threshold: 0.5, min_note_ms: 58}
  bass:
    # ≈30 Hz floor (06 §4) and a ceiling well above a 4-string's 24th fret (G5 ≈ 784 Hz is rare).
    # Thresholds from the P2 sweep on separated stems (eval/results/p2).
    transcriber: basic_pitch
    params: {min_freq_hz: 30, max_freq_hz: 600, onset_threshold: 0.7, frame_threshold: 0.5}
  piano:
    # P2 (eval/results/p2/2026-10-23.md): Transkun V2 on separated stems 0.946 onset F1 (MAESTRO
    # test excerpts + band) vs YourMT3+ 0.900 and Basic Pitch 0.645. Step 24 P2p
    # (eval/results/p2p): stereo input (+0.011 onset+offset F1), a silence gate at 45 dB (held-out
    # precision 0.880 → 0.919), per-note confidence = mean of the semi-CRF onset marginal and the
    # velocity peak (AUROC 0.885); YourMT3+ on the mixture when there is no stem (+0.043 onset F1
    # on band excerpts); PM2S hands (0.927 vs 0.885 for splitHands on unseen ASAP pieces).
    transcriber: transkun
    params: {stereo: true, gate_db: 45, confidence: onset_velocity}
    mixture: {transcriber: yourmt3}
    hands: pm2s
  vocals:
    transcriber: basic_pitch
    params: {min_freq_hz: 65, max_freq_hz: 1400}
  drums:
    # Step 25 P2d baseline: ADTOF Frame_RNN (5 classes) with its published thresholds on the
    # drum stem (eval/results/p2d). Not scheduled until `v1.drums` (apps/api/src/pipeline.ts).
    transcriber: adtof
