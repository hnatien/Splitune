# recommended_view rule of 05-analysis-schema.md, evaluated per instrument by the Node finalize
# worker (apps/node-worker). Every threshold change is logged in `changes` with the model versions
# it was tuned on.
version: 1

# D11: instruments with note-exact notation in the current release (MVP: guitar, bass; V4 piano;
# step 25 drums). Drums are behind `v1.drums`: without it the API plans no notes.drums, so drums stay
# chords_only (notes_unavailable) whatever this list says.
notation_supported: [guitar, bass, piano, drums]

# Rule 3: rough stem and more than this share of low-band notes → chords_only.
rough_stem_low_conf: 0.35
# Rule 4: more than this share of low-band notes → chords_only.
low_confidence: 0.5
# Rule 4b: a mean calibrated note confidence below the instrument's floor → chords_only
# (reason low_confidence). Piano (step 24, owner 2026-10-25): on P2p songs below 0.80 had mean
# onset F1 0.516 (4 of 81: phone and roomy uprights, a doubled band part, a BabySlakh electric
# piano) and no song with onset F1 ≥ 0.9 fell below it.
# Drums (step 25, owner 2026-10-29): on P2d songs below 0.75, 3 of 4 had onset F1 0.55-0.61
# (brushes, swing, phone); one drum-machine song at 0.79 is caught too.
min_confidence_mean:
  piano: 0.80
  drums: 0.75

# Prototype 2 gate per instrument (08): `fail` → chords_only with reason quality_gate_failed.
# Instruments not listed have no gate. P2 (eval/results/p2), Basic Pitch on separated stems:
# guitar 0.797 onset F1 (GuitarSet + band), bass 0.807 (BabySlakh, 19 tracks): both pass.
# Piano, Transkun V2 on separated stems (gate 0.80): 0.946 on MAESTRO test excerpts + band, 0.835 on
# BabySlakh tracks with acoustic piano only; tracks with electric piano or clavinet 0.676: pass.
# Drums, ADTOF on separated stems at -17 dBFS RMS (gate 0.80, P2d item-mean onset F1 ±50 ms on the
# chosen input; owner 2026-10-29): 0.838 on 42 items (2-fold CV 0.826, held-out 0.810): pass.
# Guitar, step 22 (P2g, eval/results/p2g/2026-10-28-finetune.md), Guitab E25 on the hard-band
# stems: GuitarSet 0.857 (held-out player 05: 0.873), IDMT-SMT-Guitar 0.856, Guitar-TECHS 0.566
# (amped electric, the weakest source; Basic Pitch 0.553 there): pass.
quality_gate:
  guitar: pass
  bass: pass
  piano: pass
  drums: pass

# Rule 5: the instrument default (D13).
defaults:
  guitar: tab
  bass: tab
  piano: roll
  drums: drum_grid
  vocals: f0
  other: chords_only

changes:
  - date: 2026-10-21
    change: initial proposal values from 05-analysis-schema.md
    models: []
  - date: 2026-10-21
    change: "quality_gate confirmed by Prototype 2: guitar pass, bass pass"
    models: [basic-pitch@0.4.0]
  - date: 2026-10-23
    change: "piano notation supported (falling-notes roll); quality_gate piano pass by Prototype 2"
    models: [transkun-v2@2.0.1]
  - date: 2026-10-25
    change: "min_confidence_mean piano 0.80 (owner's choice after the step 24 P2p measurement)"
    models: [transkun-v2@2.0.1]
  - date: 2026-10-25
    change: "piano chain re-measured on P2p (step 24): solo check, YourMT3+ mixture fallback, stereo Transkun with a 45 dB gate, calibrated per-note confidence, PM2S hands; quality_gate piano stays pass (chosen-input onset F1 0.876-0.960 on band tiers, 0.920-0.928 solo); a per-song mean-confidence gate is proposed, not applied"
    models: [transkun-v2@2.0.1, yourmt3-moe@mc13_256_g4_all_v7_mt3f_sqr_rms_moe_wf4_n8k2_silu_rope_rp_b80_ps2, pm2s-hand-part@zenodo-10520196, htdemucs-6s]
  - date: 2026-10-29
    change: "drums notation supported behind v1.drums (drum grid); quality_gate drums pass by P2d (0.838 item-mean onset F1, gate 0.80); min_confidence_mean drums 0.75 (owner's choice)"
    models: [adtof-frame-rnn@adtofAll_0-pt-85c192e, bs-roformer-sw]
  - date: 2026-10-29
