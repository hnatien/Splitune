# Separation model map, personal mode (06-ml-pipeline-service.md §0, 25-personal-mode.md §3).
# Each learner instrument has an ordered fallback chain: `separate` runs the first model whose
# weights verify against compliance/register and that finishes; total failure = stems_unavailable.
# The chains, mix-minus modes and quality defaults are set from Prototype 1
# (services/ml/eval/results/p1/). Changing anything here changes the stage cache keys.
version: 1

models:
  # `outputs` maps the model's stem names to instruments; null = a complement ("everything else").
  # `arch` is audio-separator's architecture; `inference` overrides single keys of its
  # mdxc_params (overlap = RoFormer window step in s, capped at the chunk length; default 8) or
  # demucs_params (shifts = random-shift passes, default 2; overlap = segment fraction, 0.25).
  # Values: the cheapest setting within 0.3 dB median uSDR of the default on the P1 clips
  # (services/ml/eval/results/p1/2026-10-21-overlap.md). RoFormer overlap = the model's chunk
  # length (no overlap between windows); viperx's chunk is 8 s, so its default already is.
  # BS-Roformer-SW: 13.35 s windows (588,800 samples) in 11.5 s steps, 1.85 s crossfade, instead
  # of its 9.29 s chunk: +0.02 to +0.18 dB median uSDR on all five instruments, bass seam 0.47 dB
  # (1.00 at the old chunk), 1.09x full-song time (step 29, eval/results/sep-improve/
  # 2026-11-08-chunk.md). Abutting windows (overlap 9.3) had left a bass seam (step 28).
  bs_roformer_sw:
    record: bs-roformer-sw
    filename: BS-Roformer-SW.ckpt
    provider: "bs_roformer:BS-Roformer-SW"
    arch: mdxc
    inference: {chunk: 588800, overlap: 11.5}
    outputs: {bass: bass, drums: drums, guitar: guitar, piano: piano, vocals: vocals, other: other}
  htdemucs_6s:
    record: htdemucs-6s
    filename: htdemucs_6s.yaml
    provider: htdemucs_6s
    arch: demucs
    inference: {shifts: 1}
    outputs: {bass: bass, drums: drums, guitar: guitar, piano: piano, vocals: vocals, other: other}
  htdemucs_ft:
    record: htdemucs-ft
    filename: htdemucs_ft.yaml
    provider: htdemucs_ft
    arch: demucs
    inference: {shifts: 1}
    outputs: {bass: bass, drums: drums, vocals: vocals, other: other}
  bs_roformer_viperx_1297:
    record: bs-roformer-viperx-1297
    filename: model_bs_roformer_ep_317_sdr_12.9755.ckpt
    provider: "bs_roformer:viperx-1297"
    arch: mdxc
    outputs: {vocals: vocals, instrumental: null}
  # Guitar-only 2-stem model (step 22 Phase 1 candidate, eval/results/p2g); outside
  # audio-separator's catalogue, loaded from `config`.
  mel_roformer_guitar_becruily:
    record: mel-roformer-guitar-becruily
    filename: mel_band_roformer_guitar_becruily.ckpt
    config: mel_band_roformer_guitar_becruily.yaml
    provider: "mel_roformer:guitar-becruily"
    arch: mdxc
    outputs: {guitar: guitar, other: null}
  mel_roformer_kim_vocals:
    record: mel-roformer-kim-vocals
    filename: vocals_mel_band_roformer.ckpt
    provider: "mel_roformer:kim-vocals"
    arch: mdxc
    inference: {overlap: 11}  # chunk 11.0 s
    outputs: {vocals: vocals, other: null}
  # MVSep's Mega-53 BS-RoFormer cut to its organ, keys, synth, piano and digital-piano heads
  # (`scripts/fetch_models.py mega53-keys`): piano's fallback when SW hears no piano (below). Its
  # keys + synth outputs make the stem; chunk 20 s, 10 s steps (MSST's 882,000 samples rounded to
  # the STFT hop, num_overlap 2), as measured in step 29.
  mega53_keys:
    record: bs-roformer-mega53-keys5
    filename: bs_roformer_mega53_keys5.ckpt
    config: bs_roformer_mega53_keys5.yaml
    provider: "bs_roformer:mega53-keys"
    arch: mdxc
    inference: {chunk: 882176, overlap: 10.002}
    outputs: {organ: null, keys: piano, synth: piano, piano: null, digital-piano: null}

# mix_minus: subtract = mixture − aligned stem; complement = sum of the model's other outputs.
# quality: the default quality_hint of the isolated stem (doc 08 P1 fail rule marks weak ones rough).
instruments:
  guitar: {chain: [bs_roformer_sw, htdemucs_6s], mix_minus: subtract, quality: good}
  piano:
    chain: [bs_roformer_sw, htdemucs_6s]
    mix_minus: subtract
    quality: good
    # Step 24 (eval/results/p2p): htdemucs_6s (~3 s per 30 s on the RTX 3060) runs first; with its
    # drums + bass + vocals below -15 dB of the mixture the song is solo piano (24/24 solo
    # excerpts, 0/57 band excerpts) and the chain is skipped.
    solo_check: {model: htdemucs_6s, threshold_db: -15}
    # Step 29 (eval/results/sep-improve/2026-11-08-keys.md): SW outputs no piano for synth- and
    # organ-heavy keys (3 of 25 MoisesDB windows with keys). Below -40 dB of the mixture, with the
    # tagger's piano present_prob at 0.03 or more (those 3, none of the 15 windows without keys),
    # Mega-53's keys + synth stand in: 4.5 dB median uSDR on those 3, 6.1 on 5 Slakh windows.
    fallback_when_silent: {model: mega53_keys, threshold_db: -40, min_present_prob: 0.03}
  bass: {chain: [bs_roformer_sw, htdemucs_ft, htdemucs_6s], mix_minus: subtract, quality: good}
  drums: {chain: [bs_roformer_sw, htdemucs_ft, htdemucs_6s], mix_minus: subtract, quality: good}
  vocals:
    chain: [mel_roformer_kim_vocals, bs_roformer_viperx_1297, bs_roformer_sw, htdemucs_ft]
    mix_minus: complement
    quality: good

# Extra stems kept for the mixer and for chords (no-drums input, bass-root prior) when the run
# that produced the learner's stem also produced them, unless the tagger is near-certain they are
# absent: PANNs scores on full mixes are low (bass ≤ 0.14, drums ≤ 0.34 on MUSDB18-HQ test), so
# only scores below keep_min_prob count as "absent" (2026-10-21, 50 test windows).
keep: [drums, bass]
keep_min_prob: 0.01
