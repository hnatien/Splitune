# Island "torch" (06-ml-pipeline-service.md §0): PyTorch MPS stages, one warm process per worker
# slot. Separate uv project and venv so heavy or conflicting model dependencies stay contained.
#   uv sync --project islands/torch
[project]
name = "splitune-island-torch"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "splitune-ml-core",
    "stage-beats",
    "stage-chords[models]",
    "stage-notes[yourmt3,transkun]",
    "stage-separation[models]",
]

[tool.uv]
package = false
required-version = ">=0.13,<0.14"

[tool.uv.sources]
splitune-ml-core = { path = "../../packages/splitune_ml_core", editable = true }
stage-beats = { path = "../../packages/stage_beats", editable = true }
stage-chords = { path = "../../packages/stage_chords", editable = true }
stage-notes = { path = "../../packages/stage_notes", editable = true }
stage-separation = { path = "../../packages/stage_separation", editable = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

# transkun 2.0.1 declares its training and plotting tools (tensorboard, seaborn, sox, ncls, ...) as
# requirements; inference (stage_notes.transkun) imports only these.
[[tool.uv.dependency-metadata]]
name = "transkun"
version = "2.0.1"
requires-dist = ["mir-eval", "numpy", "pretty-midi", "scipy", "torch", "torchaudio"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
