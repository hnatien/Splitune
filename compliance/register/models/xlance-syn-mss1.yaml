  eval/separation.eval.yaml sample_rate 48000. The YAML is ours (eval/model-configs/): X-LANCE's
  model params equal SW's except num_stems 1. ans.py also runs a denoise pre-pass and a whole-track
  fp16 pass; step 29 runs it windowed like SW without the denoise pass (owner's default,
  2026-11-07). In-sample for moisesdb-p1.
