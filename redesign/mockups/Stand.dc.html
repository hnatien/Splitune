<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stand view on a tablet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="splitune.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400..700&amp;family=Space+Grotesk:wght@400..700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="{{cls}}" data-theme="{{theme}}" style="width: 1180px; height: 820px; display: flex; flex-direction: column; overflow: hidden;">
  <header style="height: 64px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line-soft);">
    <a class="ib lg" href="Library.dc.html" aria-label="Back to library"><svg class="i l" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <span style="font-weight: 650; font-size: 18px;">Northbound Lights</span>
    <span class="badge acc" style="height: 30px; font-size: 14px; padding: 0 12px;">Loop · bars 25–28 · pass 2</span>
    <div style="flex: 1;"></div>
    <span class="badge" style="height: 30px; font-size: 14px; padding: 0 12px;"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="14" width="16" height="6" rx="2"/><path d="M7 14l3-9h4l3 9"/></svg>Pedal connected</span>
    <span class="num" style="font-size: 28px; font-weight: 600;">75 %</span>
    <button type="button" class="ib lg" aria-label="Display and reading"><svg class="i l" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19l5-14 5 14M5 14h6M14 19l3.5-9 3.5 9M15.2 16h4.6"/></svg></button>
  </header>

  <div style="flex: 1; min-height: 0; display: flex;">
    <section aria-label="Now and next" style="width: 400px; flex: none; padding: 28px 32px; border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 22px;">
      <div class="eyebrow" style="font-size: 14px;">Now · bar 26</div>
      <div style="display: flex; align-items: flex-end; gap: 24px;">
        <span class="display" style="font-size: 200px; line-height: 0.8;">C</span>
        <svg width="104" height="136" viewBox="0 0 84 110" role="img" aria-label="C major shape, x 3 2 0 1 0">
          <g fill="none" stroke="var(--line)" stroke-width="1.5"><path d="M12 40H72M12 60H72M12 80H72M12 100H72M12 20V100M24 20V100M36 20V100M48 20V100M60 20V100M72 20V100"/></g>
          <path d="M11 20H73" stroke="var(--tx2)" stroke-width="4"/>
          <g fill="var(--acc)"><circle cx="24" cy="70" r="6"/><circle cx="36" cy="50" r="6"/><circle cx="60" cy="30" r="6"/></g>
          <g fill="none" stroke="var(--tx3)" stroke-width="1.5"><circle cx="48" cy="10" r="4"/><circle cx="72" cy="10" r="4"/><path d="M8.5 6.5l7 7M15.5 6.5l-7 7"/></g>
        </svg>
      </div>
      <div class="beats" style="gap: 16px;" aria-label="Beat 3 of 4"><i class="down done" style="width: 26px; height: 26px;"></i><i class="done" style="width: 26px; height: 26px;"></i><i class="on" style="width: 26px; height: 26px;"></i><i style="width: 26px; height: 26px;"></i></div>
      <div class="hr"></div>
      <div class="eyebrow" style="font-size: 14px;">Next · in 2 beats</div>
      <span style="font-size: 100px; font-weight: 650; line-height: 0.85; letter-spacing: -0.02em;">G</span>
    </section>

    <section aria-label="Tab, bars 26 and 27" style="flex: 1; min-width: 0; padding: 90px 32px 0 24px; position: relative; --paper: var(--bg);">
      <div style="display: flex;">
        <div class="clef" style="height: 151px; font-size: 18px;" aria-hidden="true"><span>T</span><span>A</span><span>B</span></div>
        <div style="flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));">
          <sc-for list="{{bars}}" as="b" hint-placeholder-count="2">
            <div class="{{b.cls}}">
              <span class="bar-no" style="font-size: 15px; top: -30px;">{{b.no}}</span>
              <span class="{{b.chordCls}}" style="left: 10px; top: -66px; font-size: 28px;">{{b.chord}}</span>
              <div class="strings" style="height: 151px; background: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px 30px);">
                <sc-for list="{{b.notes}}" as="n" hint-placeholder-count="8"><span class="{{n.c}}" style="left: {{n.x}}%; top: {{n.y}}px; font-size: 26px; line-height: 28px; padding: 0 5px;">{{n.f}}</span></sc-for>
                <sc-if value="{{b.ph}}" hint-placeholder-val="{{false}}"><span class="playhead" style="left: 62%; width: 3px;"></span></sc-if>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
      <div class="small faint" style="position: absolute; left: 56px; bottom: 24px; font-size: 14px;">Page 7 of 46 · turns on the downbeat of bar 28</div>
    </section>
  </div>

  <footer aria-label="Transport" style="flex: none; height: 120px; border-top: 1px solid var(--line-soft); background: var(--s1); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 16px;">
    <button type="button" class="btn" style="height: 88px; flex-direction: column; gap: 4px; border-radius: 18px; font-size: 18px;"><span style="display: flex; align-items: center; gap: 10px;"><svg class="i l" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14M19 6l-9 6 9 6z"/></svg>Restart loop</span><span class="small faint" style="font-weight: 500;">Left pedal</span></button>
    <button type="button" class="btn pri" style="height: 88px; flex-direction: column; gap: 4px; border-radius: 18px; font-size: 18px;"><span style="display: flex; align-items: center; gap: 10px;"><svg class="i l fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>Pause</span><span class="small" style="font-weight: 500; opacity: 0.8;">Right pedal</span></button>
    <button type="button" class="btn" style="height: 88px; flex-direction: column; gap: 4px; border-radius: 18px; font-size: 18px;"><span style="display: flex; align-items: center; gap: 10px;"><svg class="i l" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Felt clean</span><span class="small faint" style="font-weight: 500;">Hold right pedal</span></button>
    <button type="button" class="btn" style="height: 88px; flex-direction: column; gap: 4px; border-radius: 18px; font-size: 18px;"><span>Not yet</span><span class="small faint" style="font-weight: 500;">Hold left pedal</span></button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"look":{"editor":"enum","options":["Night Rehearsal","Daylight","Annotated Score","Pedalboard"],"default":"Night Rehearsal"},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const LOOKS = { 'Night Rehearsal': ['app', 'dark'], 'Daylight': ['app', 'light'], 'Annotated Score': ['app dir-b', 'light'], 'Pedalboard': ['app dir-c', 'light'] };
    const look = LOOKS[this.props.look ?? 'Night Rehearsal'] || LOOKS['Night Rehearsal'];
    const PAT = {
      C: [[5, 3], [4, 2], [3, 0], [2, 1], [1, 0], [2, 1], [3, 0], [4, 2]],
      G: [[6, 3], [4, 0], [3, 0], [2, 3], [1, 3], [2, 3], [3, 0], [4, 0]]
    };
    const bars = [[26, 'C'], [27, 'G']].map(([no, ch]) => ({
      no, chord: ch, chordCls: 'chord-sym', cls: no === 26 ? 'bar-cell cur' : 'bar-cell inloop', ph: no === 26,
      notes: PAT[ch].map(([s, f], i) => ({ f: String(f), x: 8 + i * 12, y: (s - 1) * 30 + 0.5, c: no === 26 ? (i < 4 ? 'fn past' : i === 4 ? 'fn now' : 'fn') : ((i === 3 || i === 4) ? 'fn u' : 'fn') }))
    }));
    return { cls: look[0], theme: look[1], bars };
  }
}
</script>
</body>
</html>
