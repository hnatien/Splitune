<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Direction C · Pedalboard</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="splitune.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400..700&amp;family=Space+Grotesk:wght@400..700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="app dir-c" data-theme="light" style="width: 1280px; height: 800px; display: flex; flex-direction: column; gap: 16px; padding: 18px 22px 22px; overflow: hidden;">
  <header style="display: flex; align-items: center; gap: 16px;">
    <span style="font-weight: 700; letter-spacing: 0.14em; font-size: 15px;">SPLITUNE</span>
    <span class="vr" style="margin: 2px 0;"></span>
    <span style="font-weight: 600; letter-spacing: 0.08em; font-size: 14px; color: var(--tx2);">NORTHBOUND LIGHTS · GUITAR · A MINOR</span>
    <div style="flex: 1;"></div>
    <span class="num" style="background: oklch(0.2 0.01 250); color: oklch(0.86 0.17 80); padding: 6px 14px; border-radius: 4px; font-size: 20px; letter-spacing: 0.08em;">BAR 026.3</span>
  </header>

  <div class="app" data-theme="dark" aria-label="Tab, bars 25 to 28" style="border-radius: 8px; padding: 76px 24px 26px 14px; box-shadow: inset 0 2px 0 oklch(0 0 0 / 0.5), 0 0 0 3px var(--s3); --paper: var(--bg);">
    <div style="display: flex;">
      <div class="clef" aria-hidden="true"><span>T</span><span>A</span><span>B</span></div>
      <div class="sys" style="flex: 1; min-width: 0;">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="4">
          <div class="{{b.cls}}">
            <span class="bar-no">{{b.no}}</span><span class="{{b.chordCls}}" style="left: 8px;">{{b.chord}}</span>
            <div class="strings"><sc-for list="{{b.notes}}" as="n" hint-placeholder-count="8"><span class="{{n.c}}" style="left: {{n.x}}%; top: {{n.y}}px;">{{n.f}}</span></sc-for><sc-if value="{{b.ph}}" hint-placeholder-val="{{false}}"><span class="playhead" style="left: 62%;"></span></sc-if></div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px;">
    <section aria-label="Loop module" style="background: var(--s1); border: 2px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow);">
      <div style="display: flex; align-items: center; justify-content: space-between;"><span style="font-weight: 700; letter-spacing: 0.12em; font-size: 13px;">LOOP</span><span style="width: 12px; height: 12px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 10px var(--acc);"></span></div>
      <div style="display: flex; gap: 16px;"><span><span class="small faint" style="display: block; letter-spacing: 0.1em;">A</span><span class="num" style="font-size: 38px; font-weight: 600;">25</span></span><span><span class="small faint" style="display: block; letter-spacing: 0.1em;">B</span><span class="num" style="font-size: 38px; font-weight: 600;">28</span></span></div>
      <span class="small muted">PASS 2 · REST 1 BEAT</span>
      <div style="flex: 1;"></div>
      <button type="button" aria-label="Loop on or off" style="align-self: center; width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--line); background: radial-gradient(circle at 40% 35%, var(--s1), var(--s3)); font-weight: 700; letter-spacing: 0.1em; font-size: 12px; cursor: pointer;">LOOP</button>
    </section>
    <section aria-label="Speed module" style="background: var(--s1); border: 2px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow);">
      <span style="font-weight: 700; letter-spacing: 0.12em; font-size: 13px;">SPEED</span>
      <div style="display: flex; align-items: center; gap: 14px;">
        <svg width="96" height="96" viewBox="0 0 100 100" role="img" aria-label="Speed knob at 75 percent">
          <circle cx="50" cy="50" r="40" fill="var(--s2)" stroke="var(--line)" stroke-width="3"/>
          <path d="M22 78 A40 40 0 1 1 78 78" fill="none" stroke="var(--s3)" stroke-width="7" stroke-linecap="round"/>
          <path d="M22 78 A40 40 0 0 1 72 18" fill="none" stroke="var(--acc)" stroke-width="7" stroke-linecap="round"/>
          <path d="M50 50 L68 26" stroke="var(--tx)" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <span><span class="num" style="font-size: 34px; font-weight: 600; display: block; line-height: 1;">75 %</span><span class="small faint num">72 BPM</span></span>
      </div>
      <div style="display: flex; gap: 6px;" aria-label="Ladder: 70 done, 75 current">
        <sc-for list="{{leds}}" as="l" hint-placeholder-count="7"><span style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 50%; {{l.style}}"></span><span class="num" style="font-size: 10px; color: var(--tx3);">{{l.v}}</span></span></sc-for>
      </div>
      <div style="flex: 1;"></div>
      <button type="button" aria-label="Felt clean" style="align-self: center; width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--acc); background: radial-gradient(circle at 40% 35%, var(--s1), var(--s3)); font-weight: 700; letter-spacing: 0.1em; font-size: 12px; cursor: pointer;">CLEAN</button>
    </section>
    <section aria-label="Time module" style="background: var(--s1); border: 2px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow);">
      <span style="font-weight: 700; letter-spacing: 0.12em; font-size: 13px;">TIME</span>
      <div style="display: flex; gap: 12px;" aria-label="Beat 3 of 4"><span style="width: 26px; height: 26px; border-radius: 4px; background: var(--tx3);"></span><span style="width: 26px; height: 26px; border-radius: 50%; background: var(--tx3);"></span><span style="width: 26px; height: 26px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 12px var(--acc);"></span><span style="width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--line);"></span></div>
      <span class="small muted">COUNT-IN 1 BAR · CLICK ON</span>
      <div style="flex: 1;"></div>
      <button type="button" aria-label="Pause" style="align-self: center; width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--line); background: var(--acc); font-weight: 700; letter-spacing: 0.1em; font-size: 12px; cursor: pointer; color: var(--on-acc);">PAUSE</button>
    </section>
    <section aria-label="Mix module" style="background: var(--s1); border: 2px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow);">
      <span style="font-weight: 700; letter-spacing: 0.12em; font-size: 13px;">MIX</span>
      <div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end;">
        <sc-for list="{{faders}}" as="f" hint-placeholder-count="3">
          <span style="display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%;">
            <span style="flex: 1; width: 10px; border-radius: 5px; background: var(--s3); position: relative; min-height: 90px;"><span style="position: absolute; left: -9px; width: 28px; height: 14px; border-radius: 3px; background: var(--tx); bottom: {{f.pos}}%;"></span></span>
            <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em;">{{f.n}}</span>
          </span>
        </sc-for>
      </div>
      <button type="button" aria-label="Mute your part" style="align-self: center; width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--line); background: radial-gradient(circle at 40% 35%, var(--s1), var(--s3)); font-weight: 700; letter-spacing: 0.08em; font-size: 11px; cursor: pointer;">MUTE ME</button>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const PAT = {
      F: [[4, 3], [3, 2], [2, 1], [1, 1], [2, 1], [3, 2], [4, 3], [3, 2]],
      C: [[5, 3], [4, 2], [3, 0], [2, 1], [1, 0], [2, 1], [3, 0], [4, 2]],
      G: [[6, 3], [4, 0], [3, 0], [2, 3], [1, 3], [2, 3], [3, 0], [4, 0]],
      Am: [[5, 0], [4, 2], [3, 2], [2, 1], [1, 0], [2, 1], [3, 2], [4, 2]]
    };
    const bars = [[25, 'F'], [26, 'C'], [27, 'G'], [28, 'Am']].map(([no, ch]) => ({
      no, chord: ch, chordCls: no === 28 ? 'chord-sym u' : 'chord-sym', cls: no === 26 ? 'bar-cell cur' : 'bar-cell inloop', ph: no === 26,
      notes: PAT[ch].map(([s, f], i) => ({ f: String(f), x: 8 + i * 12, y: (s - 1) * 20 + 0.5, c: no < 26 || (no === 26 && i < 4) ? 'fn past' : (no === 26 && i === 4 ? 'fn now' : (no === 27 && (i === 3 || i === 4) ? 'fn u' : 'fn')) }))
    }));
    const leds = [70, 75, 80, 85, 90, 95, 100].map((v) => ({ v, style: v === 70 ? 'background: var(--acc);' : v === 75 ? 'background: var(--acc); box-shadow: 0 0 8px var(--acc);' : 'background: var(--s3);' }));
    const faders = [['YOU', 78], ['BAND', 52], ['CLICK', 30]].map(([n, pos]) => ({ n, pos }));
    return { bars, leds, faders };
  }
}
</script>
</body>
</html>
