<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Direction A · Night Rehearsal</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="splitune.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400..700&amp;family=Space+Grotesk:wght@400..700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="app" data-theme="dark" style="width: 1280px; height: 800px; display: flex; flex-direction: column; overflow: hidden;">
  <header style="height: 56px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line-soft);">
    <svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="var(--acc)"/><path d="M3 14c3.2-4.6 5.8 4.6 11 0s7.8 4.6 11 0" fill="none" stroke="var(--on-acc)" stroke-width="2.4" stroke-linecap="round"/></svg>
    <span style="font-weight: 650;">Northbound Lights</span><span class="small faint">Guitar · A minor</span>
    <div style="flex: 1;"></div>
    <div class="seg" role="group" aria-label="View"><button type="button" aria-pressed="true">Tab</button><button type="button" aria-pressed="false">Chords</button></div>
  </header>
  <div style="flex: none; padding: 10px 16px; border-bottom: 1px solid var(--line-soft);">
    <div class="map" style="height: 30px;">
      <div class="wave"><sc-for list="{{wave}}" as="w" hint-placeholder-count="92"><i class="{{w.c}}" style="height: {{w.h}}%;"></i></sc-for></div>
      <div class="loopband" style="left: 26.1%; width: 4.4%;"></div><div class="nowline" style="left: 27.8%;"></div>
    </div>
  </div>
  <div style="flex: 1; min-height: 0; display: flex;">
    <aside style="width: 250px; flex: none; padding: 22px; border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 16px;">
      <span class="eyebrow">Now · bar 26</span>
      <span class="display" style="font-size: 120px; line-height: 0.8;">C</span>
      <div class="beats"><i class="down done"></i><i class="done"></i><i class="on"></i><i></i></div>
      <div class="hr"></div>
      <span class="eyebrow">Next · in 2 beats</span>
      <span style="font-size: 56px; font-weight: 650; line-height: 0.9;">G</span>
    </aside>
    <main style="flex: 1; min-width: 0; padding: 86px 28px 0 20px; position: relative; --paper: var(--bg);">
      <div style="position: relative; display: flex;">
        <div class="clef" aria-hidden="true"><span>T</span><span>A</span><span>B</span></div>
        <div aria-hidden="true" style="position: absolute; left: 30px; right: 0; top: -72px; height: 12px; border: 2px solid var(--acc); border-bottom: 0; border-radius: 5px 5px 0 0;"></div>
        <div class="sys" style="flex: 1; min-width: 0;">
          <sc-for list="{{bars}}" as="b" hint-placeholder-count="4">
            <div class="{{b.cls}}">
              <span class="bar-no">{{b.no}}</span><span class="{{b.chordCls}}" style="left: 8px;">{{b.chord}}</span>
              <div class="strings"><sc-for list="{{b.notes}}" as="n" hint-placeholder-count="8"><span class="{{n.c}}" style="left: {{n.x}}%; top: {{n.y}}px;">{{n.f}}</span></sc-for><sc-if value="{{b.ph}}" hint-placeholder-val="{{false}}"><span class="playhead" style="left: 62%;"></span></sc-if></div>
            </div>
          </sc-for>
        </div>
      </div>
      <div class="sheet" style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 18px; white-space: nowrap;">
        <span style="font-weight: 600;">Pass 2 at 75 % — how was it?</span><button type="button" class="btn pri">Felt clean</button><button type="button" class="btn">Not yet</button>
      </div>
    </main>
  </div>
  <footer style="flex: none; height: 88px; border-top: 1px solid var(--line-soft); background: var(--s1); display: flex; align-items: center; gap: 16px; padding: 0 20px;">
    <button type="button" class="ib lg" aria-label="Restart loop"><svg class="i l" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14M19 6l-9 6 9 6z"/></svg></button>
    <button type="button" class="play" aria-label="Pause"><svg class="i xl fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
    <span class="num" style="font-size: 20px; font-weight: 600;">26.3</span>
    <span class="badge acc" style="height: 36px; padding: 0 14px; font-size: 14px;">Loop · bars 25–28 · pass 2</span>
    <span class="num" style="font-size: 20px;">75 %</span><span class="small faint num">72 BPM</span>
    <div style="flex: 1;"></div>
    <span class="btn">Your part loud</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const wave = [];
    for (let n = 0; n < 92; n++) {
      const bar = n + 1;
      const e = bar < 5 ? 0.32 : bar < 21 ? 0.5 : bar < 25 ? 0.62 : bar < 33 ? 0.86 : bar < 49 ? 0.52 : bar < 61 ? 0.8 : bar < 69 ? 0.56 : bar < 85 ? 0.92 : 0.38;
      wave.push({ h: Math.round(e * (0.58 + 0.42 * Math.abs(Math.sin(n * 1.93) * Math.cos(n * 0.41))) * 100), c: bar >= 25 && bar <= 28 ? 'in' : (bar < 26.6 ? 'past' : '') });
    }
    const PAT = {
      F: [[4, 3], [3, 2], [2, 1], [1, 1], [2, 1], [3, 2], [4, 3], [3, 2]],
      C: [[5, 3], [4, 2], [3, 0], [2, 1], [1, 0], [2, 1], [3, 0], [4, 2]],
      G: [[6, 3], [4, 0], [3, 0], [2, 3], [1, 3], [2, 3], [3, 0], [4, 0]],
      Am: [[5, 0], [4, 2], [3, 2], [2, 1], [1, 0], [2, 1], [3, 2], [4, 2]]
    };
    const bars = [[25, 'F'], [26, 'C'], [27, 'G'], [28, 'Am']].map(([no, ch]) => ({
      no, chord: ch, chordCls: no === 28 ? 'chord-sym u' : 'chord-sym', cls: no === 26 ? 'bar-cell cur' : 'bar-cell inloop', ph: no === 26,
      notes: PAT[ch].map(([s, f], i) => ({ f: String(f), x: 8 + i * 12, y: (s - 1) * 20 + 0.5, c: no < 26 || (no === 26 && i < 4) ? 'fn past' : (no === 26 && i === 4 ? 'fn now' : (no === 27 && (i === 3 || i === 4) ? 'fn u' : 'fn')) }))
    }));
    return { wave, bars };
  }
}
</script>
</body>
</html>
