<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Splitune listening test</title>
    <style>
      :root { color-scheme: light dark; --fg: #1d1b18; --bg: #fbf8f2; --muted: #5f5a52; --line: #c9c2b6; --accent: #1f5f8b; }
      @media (prefers-color-scheme: dark) { :root { --fg: #efe9df; --bg: #1a1916; --muted: #b5ada0; --line: #4a463f; --accent: #7fb6dd; } }
      body { margin: 0; font: 17px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
      main { max-width: 42rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
      h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
      .muted { color: var(--muted); }
      fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 0.75rem 1rem; margin: 1rem 0; }
      legend { font-weight: 600; padding: 0 0.25rem; }
      label { display: block; margin: 0.35rem 0; cursor: pointer; }
      audio { width: 100%; margin: 0.25rem 0 0.75rem; }
      button { font: inherit; padding: 0.55rem 1rem; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; min-height: 44px; }
      button.primary, button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
      :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
      .side { border: 1px solid var(--line); border-radius: 8px; padding: 0.5rem 0.75rem; margin: 0.5rem 0; }
      input, select { font: inherit; padding: 0.4rem; min-width: 14rem; }
      progress { width: 100%; height: 0.6rem; }
      kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 0.3rem; font-size: 0.85em; }
    </style>
  </head>
  <body>
    <main>
      <h1>Splitune listening test</h1>
      <p class="muted">Blind test: you won't be told which system made what. Headphones help.</p>
      <div id="app" aria-live="polite"></div>
      <noscript>This page needs JavaScript.</noscript>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
